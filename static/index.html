<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MyFarm</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { --bg: #f5f6f1; --card: #fff; --ink: #1f2a1c; --muted: #6b7466; --accent: #3f7d20; --warn: #c2410c; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
    header { padding: 14px 20px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 22px; color: var(--accent); }
    header span { color: var(--muted); }
    .layout { display: grid; grid-template-columns: 1fr 360px; gap: 14px; padding: 0 20px 20px; }
    #map { height: calc(100vh - 90px); min-height: 480px; border-radius: 12px; }
    aside { display: flex; flex-direction: column; gap: 12px; max-height: calc(100vh - 90px); overflow-y: auto; }
    .card { background: var(--card); border-radius: 12px; padding: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
    .card h2 { margin: 0 0 10px; font-size: 15px; }
    .row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 14px; }
    .row b { font-variant-numeric: tabular-nums; }
    label { font-size: 13px; color: var(--muted); }
    select, input, button { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid #d6dbd0; background: #fff; }
    button { background: var(--accent); color: #fff; border: 0; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .controls .full { grid-column: 1 / -1; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: #fef3c7; color: #92400e; }
    .badge.real { background: #dcfce7; color: #166534; }
    .zone { display: flex; align-items: center; gap: 8px; font-size: 14px; padding: 4px 0; }
    .swatch { width: 14px; height: 14px; border-radius: 4px; flex: none; }
    .muted { color: var(--muted); font-size: 13px; }
    .error { color: var(--warn); font-size: 13px; }
    .legend { background: #fff; padding: 8px 10px; border-radius: 8px; font-size: 12px; line-height: 1.6; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } #map { height: 60vh; } aside { max-height: none; } }
  </style>
</head>
<body>
  <header>
    <h1>MyFarm</h1>
    <span id="parcelTitle">Agriculture de précision</span>
  </header>

  <div class="layout">
    <div id="map"></div>

    <aside>
      <div class="card">
        <h2>Analyse de la parcelle</h2>
        <div class="controls">
          <div class="full">
            <label for="source">Images</label><br />
            <select id="source" style="width:100%">
              <option value="demo">Démo (bandes simulées)</option>
              <option value="sentinel">Sentinel-2 réel (internet)</option>
            </select>
          </div>
          <div><label for="start">Du</label><br /><input id="start" type="date" value="2025-06-01" /></div>
          <div><label for="end">Au</label><br /><input id="end" type="date" value="2025-07-15" /></div>
          <div>
            <label for="layer">Carte</label><br />
            <select id="layer">
              <option value="zone">Zones</option>
              <option value="NDVI">NDVI</option>
              <option value="NDRE">NDRE</option>
              <option value="NDMI">NDMI (eau)</option>
              <option value="EVI">EVI</option>
              <option value="GNDVI">GNDVI</option>
            </select>
          </div>
          <div>
            <label for="k">Nombre de zones</label><br />
            <select id="k"><option>2</option><option selected>3</option><option>4</option></select>
          </div>
          <button id="run" class="full">Analyser</button>
        </div>
        <p id="scanInfo" class="muted"></p>
      </div>

      <div class="card">
        <h2>Zones de gestion</h2>
        <div id="zones" class="muted">—</div>
      </div>

      <div class="card">
        <h2>Météo et irrigation</h2>
        <div class="controls">
          <div><label for="kc">Coefficient cultural Kc</label><br /><input id="kc" type="number" min="0.1" max="1.5" step="0.05" value="1.0" style="width:100%" /></div>
          <div><label for="base">T° de base (°C)</label><br /><input id="base" type="number" min="0" max="20" step="1" value="10" style="width:100%" /></div>
        </div>
        <div id="weather" class="muted" style="margin-top:8px">—</div>
        <canvas id="chart" height="180"></canvas>
      </div>
    </aside>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
  <script>
    const ZONE_COLORS = { 2: ['#d97706', '#15803d'], 3: ['#dc2626', '#eab308', '#15803d'], 4: ['#991b1b', '#ea580c', '#eab308', '#15803d'] };
    const RANGES = { NDVI: [0, 0.9], NDRE: [0, 0.5], NDMI: [-0.3, 0.5], EVI: [0, 1], GNDVI: [0, 0.9] };
    const $ = (id) => document.getElementById(id);
    const ZONE_FR = { 'very low': 'très faible', low: 'faible', medium: 'moyenne', high: 'forte' };

    const map = L.map('map');
    const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 20, maxNativeZoom: 18, attribution: 'Imagery © Esri',
    }).addTo(map);
    const streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 20, maxNativeZoom: 19, attribution: '© OpenStreetMap',
    });
    L.control.layers({ 'Satellite': satellite, 'Plan': streets }).addTo(map);
    const pixelLayer = L.layerGroup().addTo(map);
    let scanData = null, chart = null;

    // red -> yellow -> green
    function ramp(value, [lo, hi]) {
      const t = Math.min(1, Math.max(0, (value - lo) / (hi - lo)));
      const r = t < 0.5 ? 220 : Math.round(220 - (t - 0.5) * 2 * 199);
      const g = t < 0.5 ? Math.round(38 + t * 2 * 166) : Math.round(204 - (t - 0.5) * 2 * 76);
      return `rgb(${r},${g},38)`;
    }

    async function getJSON(url) {
      const res = await fetch(url);
      const body = await res.json();
      if (!res.ok) throw new Error(body.detail || res.statusText);
      return body;
    }

    async function loadParcel() {
      const p = await getJSON('/api/parcel');
      $('parcelTitle').textContent = `Parcelle « ${p.properties.name} » · ${p.properties.area_ha} ha · ${p.pixels} pixels de 10 m`;
      const outline = L.geoJSON(p, { style: { color: '#fff', weight: 2, fill: false } }).addTo(map);
      map.fitBounds(outline.getBounds(), { padding: [30, 30] });
    }

    function drawPixels() {
      if (!scanData) return;
      pixelLayer.clearLayers();
      const layer = $('layer').value, k = scanData.summary.k;
      for (const px of scanData.pixels) {
        const dLat = 5 / 111320, dLon = 5 / (111320 * Math.cos(px.lat * Math.PI / 180));
        const color = layer === 'zone' ? ZONE_COLORS[k][px.zone] : ramp(px[layer], RANGES[layer]);
        L.rectangle([[px.lat - dLat, px.lon - dLon], [px.lat + dLat, px.lon + dLon]], {
          color, weight: 0, fillOpacity: 0.65,
        }).bindTooltip(`Vigueur ${ZONE_FR[px.zone_name]}<br>NDVI ${px.NDVI.toFixed(2)} · NDRE ${px.NDRE.toFixed(2)} · NDMI ${px.NDMI.toFixed(2)}`
          + (px.water_stress ? '<br>⚠ stress hydrique probable' : '')).addTo(pixelLayer);
      }
    }

    async function runScan() {
      const btn = $('run');
      btn.disabled = true; btn.textContent = 'Analyse…';
      $('scanInfo').className = 'muted'; $('scanInfo').textContent = '';
      try {
        const q = new URLSearchParams({ source: $('source').value, start: $('start').value, end: $('end').value, k: $('k').value });
        scanData = await getJSON(`/api/scan?${q}`);
        const m = scanData.meta;
        $('scanInfo').innerHTML = m.source === 'demo'
          ? '<span class="badge">Données simulées</span> pour démontrer la méthode'
          : `<span class="badge real">Sentinel-2</span> image du ${m.date}, nuages ${Math.round(m.cloud_cover)} %, ${m.valid_pixels}/${m.total_pixels} pixels utilisables`;
        renderZones();
        drawPixels();
      } catch (error) {
        $('scanInfo').className = 'error';
        $('scanInfo').textContent = `Erreur : ${error.message}`;
      } finally {
        btn.disabled = false; btn.textContent = 'Analyser';
      }
    }

    function renderZones() {
      const s = scanData.summary;
      const zones = s.zones.map((z) => `
        <div class="zone"><span class="swatch" style="background:${ZONE_COLORS[s.k][z.zone]}"></span>
        <span style="flex:1">Vigueur ${ZONE_FR[z.name]}</span><b>${z.share_pct} %</b></div>
        <div class="muted" style="margin:0 0 4px 22px">NDVI ${z.mean_NDVI} · NDRE ${z.mean_NDRE} · NDMI ${z.mean_NDMI}</div>`).join('');
      $('zones').innerHTML = zones + `
        <div class="row" style="margin-top:6px"><span>Séparation des zones (silhouette)</span><b>${s.silhouette}</b></div>
        <div class="row"><span>Végétation faible (NDVI &lt; 0,3)</span><b>${s.flags.low_vegetation_pct} %</b></div>
        <div class="row"><span>Stress hydrique probable (NDMI &lt; 0)</span><b>${s.flags.water_stress_pct} %</b></div>`;
    }

    async function loadWeather() {
      try {
        const w = await getJSON(`/api/weather?kc=${$('kc').value}&base=${$('base').value}`);
        const t = w.totals, days = w.days;
        $('weather').innerHTML = `
          <div class="row"><span>Période</span><b>${days[0].date} → ${days.at(-1).date}</b></div>
          <div class="row"><span>Jours de stress thermique (≥ 35 °C)</span><b>${t.heat_stress_days} / ${t.days}</b></div>
          <div class="row"><span>Degrés-jours de croissance</span><b>${t.gdd_total}</b></div>
          <div class="row"><span>Déficit hydrique</span><b>${t.deficit_mm} mm</b></div>
          <div class="row"><span>Eau à apporter sur la parcelle</span><b>${t.deficit_m3.toLocaleString('fr-FR')} m³</b></div>`;
        const data = {
          labels: days.map((d) => d.date.slice(5)),
          datasets: [
            { type: 'line', label: 'T° max (°C)', data: days.map((d) => d.tmax), borderColor: '#dc2626', yAxisID: 'y', tension: 0.3 },
            { type: 'bar', label: 'Besoin en eau (mm)', data: days.map((d) => d.crop_need_mm), backgroundColor: '#60a5fa', yAxisID: 'y1' },
          ],
        };
        if (chart) chart.destroy();
        chart = new Chart($('chart'), {
          data,
          options: {
            plugins: { legend: { labels: { boxWidth: 10, font: { size: 11 } } } },
            scales: { y: { position: 'left' }, y1: { position: 'right', grid: { drawOnChartArea: false } } },
          },
        });
      } catch (error) {
        $('weather').className = 'error';
        $('weather').textContent = `Météo indisponible : ${error.message}`;
      }
    }

    $('run').addEventListener('click', runScan);
    $('layer').addEventListener('change', drawPixels);
    $('kc').addEventListener('change', loadWeather);
    $('base').addEventListener('change', loadWeather);

    loadParcel().then(runScan);
    loadWeather();
  </script>
</body>
</html>
